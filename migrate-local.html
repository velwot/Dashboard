<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Career OS Migration</title>

  <style>
    body {
      font-family: system-ui, sans-serif;
      max-width: 760px;
      margin: 40px auto;
      padding: 20px;
    }

    .card {
      border: 1px solid #ddd;
      border-radius: 12px;
      padding: 18px;
      margin-top: 16px;
    }

    pre {
      white-space: pre-wrap;
      background: #f5f5f5;
      padding: 14px;
      border-radius: 8px;
    }

    button {
      padding: 10px 14px;
      margin-right: 8px;
      cursor: pointer;
    }

    #migrate {
      display: none;
    }
  </style>
</head>

<body>

  <h1>Career OS Cloud Migration</h1>

  <p>
    This page migrates your existing v4 browser data into your
    authenticated Supabase account.
  </p>

  <div class="card">
    <h2>Safety</h2>

    <p>
      Your localStorage data will not be deleted.
      A JSON backup will be created before migration.
    </p>

    <button id="backup">
      Create backup
    </button>

    <button id="preview">
      Preview local data
    </button>

    <button id="migrate">
      Migrate to Supabase
    </button>
  </div>

  <div class="card">
    <h2>Result</h2>
    <pre id="output">Ready.</pre>
  </div>

  <script type="module">
    import {
      readLocalState,
      validateLocalState,
      makeBackup,
      migrationPreview,
      migrateLocalState
    } from "./src/migrate-local.js";

    const output = document.getElementById("output");
    const migrateButton = document.getElementById("migrate");

    let state = null;

    document
      .getElementById("backup")
      .addEventListener("click", () => {
        try {
          state = makeBackup();

          output.textContent =
            "Backup created successfully.\n\n" +
            JSON.stringify(
              migrationPreview(state),
              null,
              2
            );

          migrateButton.style.display = "inline-block";
        } catch (error) {
          output.textContent =
            `Backup failed:\n${error.message}`;
        }
      });

    document
      .getElementById("preview")
      .addEventListener("click", () => {
        try {
          state = readLocalState();

          validateLocalState(state);

          output.textContent =
            JSON.stringify(
              migrationPreview(state),
              null,
              2
            );

          migrateButton.style.display = "inline-block";
        } catch (error) {
          output.textContent =
            `Preview failed:\n${error.message}`;
        }
      });

    migrateButton.addEventListener("click", async () => {
      if (!state) {
        output.textContent =
          "Create a backup or preview first.";

        return;
      }

      const preview = migrationPreview(state);

      const confirmed = confirm(
        "Migrate these records to Supabase?\n\n" +
        JSON.stringify(preview, null, 2)
      );

      if (!confirmed) {
        return;
      }

      output.textContent = "Migrating...";

      try {
        const result = await migrateLocalState(state);

        output.textContent =
          "Migration completed successfully.\n\n" +
          JSON.stringify(result, null, 2);
      } catch (error) {
        console.error(error);

        output.textContent =
          `Migration failed:\n${error.message}\n\n` +
          "Your local data was not deleted.";
      }
    });
  </script>

</body>
</html>
