<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#111827">
<link rel="manifest" href="./manifest.webmanifest">
<title>ICT → AI Era Career Dashboard v4</title>
<style>
:root{--bg:#f6f7fb;--panel:#fff;--text:#18202a;--muted:#667085;--line:#e5e7eb;--accent:#4f46e5;--accent2:#eef2ff;--good:#15803d;--goodbg:#ecfdf3;--warn:#b45309;--warnbg:#fff7ed;--danger:#b91c1c;--dangerbg:#fef2f2;--shadow:0 6px 24px rgba(16,24,40,.07)}
*{box-sizing:border-box}body{margin:0;font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:var(--bg);color:var(--text);line-height:1.45}
button,input,select,textarea{font:inherit}button{cursor:pointer}.app{display:grid;grid-template-columns:255px 1fr;min-height:100vh}
aside{background:#111827;color:#fff;padding:20px;position:sticky;top:0;height:100vh}.brand{font-weight:800;font-size:17px}.brand-sub{font-size:12px;color:#9ca3af;margin:4px 0 20px}nav button{width:100%;text-align:left;border:0;background:transparent;color:#d1d5db;padding:10px 11px;border-radius:9px;margin:2px 0}nav button.active,nav button:hover{background:#1f2937;color:#fff}.side-note{font-size:11px;color:#9ca3af;margin-top:16px}.sidebar-foot{position:absolute;bottom:16px;left:20px;right:20px;font-size:11px;color:#9ca3af}
main{padding:28px;max-width:1500px;width:100%;margin:auto}header{display:flex;justify-content:space-between;gap:16px;align-items:flex-start;margin-bottom:18px}
h1{font-size:28px;letter-spacing:-.02em;margin:0 0 6px}h2{font-size:20px;margin:0 0 8px}h3{font-size:15px;margin:0 0 8px}p{margin:6px 0;color:var(--muted)}
.small{font-size:12px;color:var(--muted)}.actions,.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.right{margin-left:auto}
button.primary,button.ghost,.icon,.chip{border:1px solid var(--line);border-radius:9px;padding:9px 12px;background:#fff;color:var(--text)}button.primary{background:var(--accent);color:#fff;border-color:var(--accent)}.icon{padding:6px 9px}
.grid{display:grid;gap:14px}.cards{grid-template-columns:repeat(auto-fit,minmax(160px,1fr))}.two{grid-template-columns:repeat(auto-fit,minmax(340px,1fr))}.three{grid-template-columns:repeat(auto-fit,minmax(240px,1fr))}
.card{background:var(--panel);border:1px solid var(--line);border-radius:13px;padding:16px;box-shadow:var(--shadow)}.section{margin-top:18px}.stat{font-size:27px;font-weight:800}.stat-label{font-size:12px;color:var(--muted)}
.progress{height:8px;background:#eef0f4;border-radius:999px;overflow:hidden}.progress span{display:block;height:100%;background:var(--accent);border-radius:999px}
.badge{display:inline-flex;padding:3px 7px;border-radius:999px;font-size:11px;font-weight:700;background:#f3f4f6;color:#475467}.badge.good{background:var(--goodbg);color:#166534}.badge.warn{background:var(--warnbg);color:#9a3412}.badge.danger{background:var(--dangerbg);color:#991b1b}
table{width:100%;border-collapse:collapse}th,td{padding:9px 7px;border-bottom:1px solid var(--line);text-align:left;font-size:13px;vertical-align:top}th{font-size:12px;color:var(--muted)}
input,select,textarea{width:100%;border:1px solid #d0d5dd;border-radius:8px;padding:9px 10px;background:#fff;color:var(--text)}textarea{min-height:90px;resize:vertical}label{font-size:12px;font-weight:700;color:#344054;display:block;margin-bottom:5px}.form{display:grid;grid-template-columns:repeat(auto-fit,minmax(185px,1fr));gap:10px}.full{grid-column:1/-1}
.list{display:flex;flex-direction:column;gap:8px}.item{border:1px solid var(--line);border-radius:10px;padding:12px;background:#fff}.item-head{display:flex;justify-content:space-between;gap:10px;align-items:flex-start}.item-title{font-weight:700}
.link{color:#4338ca;text-decoration:none}.link:hover{text-decoration:underline}.privacy{background:var(--goodbg);border:1px solid #bbf7d0;color:#166534;padding:12px;border-radius:10px;font-size:13px}.notice{background:#fffbeb;border:1px solid #fde68a;color:#854d0e;padding:11px;border-radius:10px;font-size:13px}.dangerbox{background:var(--dangerbg);border:1px solid #fecaca;color:#991b1b;padding:11px;border-radius:10px;font-size:13px}
.chip{padding:7px 9px;font-size:12px}.chip.active{background:var(--accent2);border-color:#c7d2fe;color:#3730a3;font-weight:700}.score{display:flex;align-items:center;gap:8px}.scorebar{flex:1;height:7px;border-radius:999px;background:#eef0f4;overflow:hidden}.scorebar span{display:block;height:100%;background:var(--accent)}
.pipeline{display:grid;grid-template-columns:repeat(6,minmax(170px,1fr));gap:10px;overflow:auto}.lane{background:#f8fafc;border:1px solid var(--line);border-radius:12px;padding:10px;min-height:220px}.lane h3{font-size:13px}.kanban{display:flex;flex-direction:column;gap:7px}.opp-card{background:#fff;border:1px solid var(--line);border-radius:9px;padding:9px}.opp-card:hover{border-color:#c7d2fe}.urgency{font-size:11px;font-weight:700}
.modal{position:fixed;inset:0;background:rgba(17,24,39,.45);display:none;align-items:center;justify-content:center;padding:18px;z-index:20}.modal.show{display:flex}.modal-box{background:#fff;max-width:760px;width:100%;max-height:92vh;overflow:auto;border-radius:14px;padding:18px;box-shadow:0 16px 60px rgba(0,0,0,.25)}
.toast{position:fixed;right:18px;bottom:18px;background:#111827;color:#fff;padding:10px 13px;border-radius:9px;display:none;z-index:30}.toast.show{display:block}
@media(max-width:1050px){.pipeline{grid-template-columns:repeat(3,minmax(180px,1fr));overflow:auto}}@media(max-width:850px){.app{grid-template-columns:1fr}aside{position:relative;height:auto}.sidebar-foot{position:static;margin-top:12px}main{padding:18px}header{flex-direction:column}.full{grid-column:auto}}
</style>
</head>
<body>
<div class="app">
<aside>
  <div class="brand">ICT → AI Era</div>
  <div class="brand-sub">Career + opportunity engine</div>
  <nav id="nav"></nav>
  <div class="side-note">Discovery is public.<br>Tracking is private.</div>
  <div class="sidebar-foot">v4 · local-first · PWA capable</div>
</aside>
<main>
<header>
  <div><div class="small" id="today"></div><h1 id="title">Dashboard</h1><p id="subtitle">Turn opportunities into actions and outcomes.</p></div>
  <div class="actions"><button class="primary" onclick="addOpportunity()">+ Opportunity</button><button class="ghost" onclick="exportPrivate()">Export</button><button class="ghost" onclick="openGpt()">GPT sync</button></div>
  <input id="privateFile" type="file" accept=".json,application/json" hidden onchange="importPrivate(event)">
</header>
<div id="view"></div>
</main>
</div>
<div id="modal" class="modal"><div id="modalBox" class="modal-box"></div></div><div id="toast" class="toast"></div>

<script>
const PRIVATE_KEY="ictAiCareerDashboard.private.v4";
const DEFAULT_PRIVATE={schemaVersion:1,type:"private-backup",profile:{name:"",degree:"BE ICT",startYear:new Date().getFullYear(),target:"AI Systems / AI Engineering + Systems"},taskState:{},tasks:[],projects:[],people:[],opportunities:[],evidence:[],reviews:[],notes:[],settings:{focusYear:1,lastReview:"",notifications:false}};
let P=loadPrivate(), T={schemaVersion:1,type:"public-template",goals:[],tasks:[],checklist:{},links:[],sources:[]}, view="dashboard", search="";
const STAGES=["discovered","shortlisted","preparing","applied","assessment","interview","accepted","rejected","withdrawn"];
const TASK_STATUS=["todo","done"];

function esc(v=""){return String(v).replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m]))}
function uid(p){return p+Math.random().toString(36).slice(2,9)}
function save(){localStorage.setItem(PRIVATE_KEY,JSON.stringify(P))}
function loadPrivate(){try{const x=JSON.parse(localStorage.getItem(PRIVATE_KEY));return {...DEFAULT_PRIVATE,...x,profile:{...DEFAULT_PRIVATE.profile,...(x?.profile||{})},settings:{...DEFAULT_PRIVATE.settings,...(x?.settings||{})}}}catch{return structuredClone(DEFAULT_PRIVATE)}}
async function boot(){
 try{const r=await fetch("./data/public-template.json",{cache:"no-store"});if(r.ok)T=await r.json()}catch(e){console.warn("Public template unavailable",e)}
 if("serviceWorker" in navigator && location.protocol!=="file:")navigator.serviceWorker.register("./sw.js").catch(()=>{});
 renderNav();render();deadlinePulse();
}
function toast(m){const x=document.getElementById("toast");x.textContent=m;x.classList.add("show");setTimeout(()=>x.classList.remove("show"),2400)}
function modal(title,body,actions=""){document.getElementById("modalBox").innerHTML=`<div class="item-head"><h2>${title}</h2><button class="icon" onclick="closeModal()">×</button></div>${body}<div class="actions" style="margin-top:12px">${actions}</div>`;document.getElementById("modal").classList.add("show")}
function closeModal(){document.getElementById("modal").classList.remove("show")}
function setView(v){view=v;renderNav();render()}
function renderNav(){const items=[["dashboard","Dashboard"],["discover","Discover"],["opportunities","Opportunity Pipeline"],["deadlines","Deadlines"],["actions","My Actions"],["projects","Projects"],["network","Network"],["proof","Proof"],["review","Review"],["data","Private Data"]];document.getElementById("nav").innerHTML=items.map(([id,n])=>`<button class="${view===id?"active":""}" onclick="setView('${id}')">${n}</button>`).join("")}
function render(){document.getElementById("today").textContent=new Date().toLocaleDateString(undefined,{weekday:"long",year:"numeric",month:"long",day:"numeric"});const meta={dashboard:["Dashboard","Turn opportunities into actions and outcomes."],discover:["Discover","Public sources for internships, hackathons, research, competitions and events."],opportunities:["Opportunity Pipeline","Track every serious opportunity from discovery to outcome."],deadlines:["Deadlines","Prevent missed applications and forgotten follow-ups."],actions:["My Actions","Execution tasks across the four-year roadmap."],projects:["Projects","Proof-producing work, not tutorial collections."],network:["Network","Real relationships and follow-ups."],proof:["Proof","External evidence of your ability."],review:["Review","Weekly reflection and opportunity-cost control."],data:["Private Data","Your personal data stays in this browser unless you explicitly export it."]}[view];document.getElementById("title").textContent=meta[0];document.getElementById("subtitle").textContent=meta[1];({dashboard,discover,opportunities,deadlines,actions,projects,network,proof,review,data})[view] && (document.getElementById("view").innerHTML=({dashboard,discover,opportunities,deadlines,actions,projects,network,proof,review,data})[view]())}
function daysUntil(d){if(!d)return null;const a=new Date();a.setHours(0,0,0,0);const b=new Date(d+"T00:00:00");return Math.ceil((b-a)/86400000)}
function urgency(o){const d=daysUntil(o.deadline);if(d===null)return {label:"No deadline",cls:""};if(d<0)return {label:"Overdue",cls:"danger"};if(d<=3)return {label:"≤3 days",cls:"danger"};if(d<=7)return {label:"≤7 days",cls:"warn"};if(d<=14)return {label:"≤14 days",cls:"warn"};return {label:`${d} days`,cls:"good"}}
function fitScore(o){let s=0;s+=Number(o.fit||0);s+=Number(o.proofValue||0);s+=Number(o.learningValue||0);if(o.deadline){const d=daysUntil(o.deadline);if(d!==null&&d>=0&&d<=14)s+=5}return Math.min(100,Math.round(s/3))}
function dashboard(){
 const open=P.opportunities.filter(o=>o.status!=="closed"), overdue=open.filter(o=>daysUntil(o.deadline)<0), due=open.filter(o=>daysUntil(o.deadline)!==null&&daysUntil(o.deadline)>=0&&daysUntil(o.deadline)<=14), follow=open.filter(o=>o.followUpDate&&daysUntil(o.followUpDate)<=3&&daysUntil(o.followUpDate)>=0);
 const ts=mergedTasks(),done=ts.filter(t=>t.status==="done").length,pct=Math.round(done/(ts.length||1)*100);
 const top=open.slice().sort((a,b)=>fitScore(b)-fitScore(a)).slice(0,5);
 return `<div class="privacy"><b>Opportunity engine model:</b> Discover → Shortlist → Prepare → Apply → Interview → Outcome. This static version uses public sources and private tracking; it does not pretend to continuously scrape third-party sites.</div>
 <div class="section grid cards">${stat("Open opportunities",open.length)}${stat("Due ≤14 days",due.length)}${stat("Overdue",overdue.length)}${stat("Follow-ups ≤3 days",follow.length)}${stat("Task completion",pct+"%")}${stat("Proof items",P.evidence.length)}</div>
 <div class="section grid two"><div class="card"><div class="item-head"><h2>Attention now</h2><button class="ghost" onclick="setView('deadlines')">See deadlines</button></div>
 ${overdue.length?`<div class="dangerbox"><b>${overdue.length} overdue</b> — resolve, withdraw or update them.</div>`:""}<div class="list" style="margin-top:8px">${[...due,...follow].slice(0,7).map(oppRow).join("")||'<div class="empty">Nothing urgent. Good.</div>'}</div></div>
 <div class="card"><h2>Best current bets</h2><p class="small">Score is a decision aid, not a prediction. Fit + proof value + learning value.</p><div class="list">${top.map(o=>oppRow(o,true)).join("")||'<div class="empty">Add serious opportunities from Discover.</div>'}</div></div></div>
 <div class="section card"><h2>What makes this useful</h2><div class="grid three"><div class="item"><b>Deadline engine</b><p class="small">Urgency labels, overdue detection and follow-up queue.</p></div><div class="item"><b>Application CRM</b><p class="small">Keep stage, contact, notes, application URL and outcome in one record.</p></div><div class="item"><b>Career compounding</b><p class="small">Tie opportunities to projects, skills and proof rather than applying randomly.</p></div></div></div>`;
}
function stat(l,v){return `<div class="card"><div class="stat">${v}</div><div class="stat-label">${l}</div></div>`}
function mergedTasks(){return [...(T.tasks||[]),...(P.tasks||[]).filter(x=>!(T.tasks||[]).some(t=>t.id===x.id))].map(t=>P.taskState[t.id]?{...t,...P.taskState[t.id]}:t)}
function oppRow(o,compact=false){const u=urgency(o);const score=fitScore(o);return `<div class="item"><div class="item-head"><div><div class="item-title">${esc(o.title)}</div><div class="small">${esc(o.type||"")} ${o.company?`· ${esc(o.company)}`:""} ${o.deadline?`· deadline ${esc(o.deadline)}`:""} ${o.followUpDate?`· follow-up ${esc(o.followUpDate)}`:""}</div></div><div class="row"><span class="badge ${u.cls}">${u.label}</span><span class="badge">${score}/100</span><button class="icon" onclick="editOpportunity('${o.id}')">✎</button></div></div><div class="small">${esc(o.stage||"discovered")} · ${esc(o.status||"open")}${o.contact?` · contact: ${esc(o.contact)}`:""}</div>${o.applyUrl&&!compact?`<a class="link small" target="_blank" rel="noreferrer" href="${esc(o.applyUrl)}">Application</a>`:""}</div>`}
function discover(){
 const cats=[...new Set((T.sources||[]).map(s=>s.kind))];
 return `<div class="privacy"><b>Discovery is intentionally human-in-the-loop.</b> Click a source, inspect the actual opportunity, then save only worthwhile items. This avoids a noisy feed and avoids pretending a static site has guaranteed live scraping.</div>
 <div class="section form"><div><label>Search sources</label><input id="srcSearch" value="${esc(search)}" oninput="search=this.value;render()"></div><div><label>Category</label><select id="srcCat" onchange="window.srcCat=this.value;render()"><option value="all">All</option>${cats.map(c=>`<option ${window.srcCat===c?"selected":""}>${esc(c)}</option>`).join("")}</select></div></div>
 <div class="section grid two">${(T.sources||[]).filter(s=>(window.srcCat&&window.srcCat!=="all"?s.kind===window.srcCat:true)&&(!search||(s.title+" "+s.kind+" "+s.region).toLowerCase().includes(search.toLowerCase()))).map(s=>`<div class="card"><div class="item-head"><div><span class="badge">${esc(s.kind)}</span><h3 style="margin-top:8px">${esc(s.title)}</h3></div><span class="small">${esc(s.cadence)}</span></div><p>${esc(s.notes)}</p><div class="small">${esc(s.region)}</div><div class="actions" style="margin-top:9px"><a class="ghost" style="text-decoration:none" target="_blank" rel="noreferrer" href="${esc(s.url)}">Open source</a><button class="ghost" onclick="captureSource('${encodeURIComponent(JSON.stringify(s))}')">Save opportunity</button></div></div>`).join("")}</div>
 <div class="section card"><h2>Weekly discovery rule</h2><p>Spend a bounded block of time scanning sources. Add only opportunities that fit your year, direction, skill level or network goals. Then convert each accepted opportunity into a deadline and next action.</p></div>`;
}
function captureSource(s){const x=JSON.parse(decodeURIComponent(s));addOpportunity({...x,title:x.title,type:x.kind,sourceUrl:x.url})}
function opportunities(){
 let a=P.opportunities.slice();a.sort((x,y)=>fitScore(y)-fitScore(x));const stages=STAGES;
 const q=search.toLowerCase();if(q)a=a.filter(o=>(o.title+" "+o.company+" "+o.type+" "+o.stage+" "+o.status).toLowerCase().includes(q));
 return `<div class="card"><div class="form"><div><label>Search opportunities</label><input value="${esc(search)}" oninput="search=this.value;render()"></div><div><label>Stage</label><select onchange="window.oppStage=this.value;render()"><option value="all">All stages</option>${stages.map(s=>`<option ${window.oppStage===s?"selected":""}>${s}</option>`).join("")}</select></div><div><label>Status</label><select onchange="window.oppStatus=this.value;render()"><option value="all">All</option><option ${window.oppStatus==="open"?"selected":""}>open</option><option ${window.oppStatus==="done"?"selected":""}>done</option><option ${window.oppStatus==="closed"?"selected":""}>closed</option></select></div></div><div class="actions" style="margin-top:10px"><button class="primary" onclick="addOpportunity()">+ Add opportunity</button><button class="ghost" onclick="search='';window.oppStage='all';window.oppStatus='all';render()">Clear filters</button></div></div>
 <div class="section pipeline">${stages.map(stage=>{const list=a.filter(o=>(window.oppStage&&window.oppStage!=="all"?o.stage===window.oppStage:true)&&(window.oppStatus&&window.oppStatus!=="all"?o.status===window.oppStatus:true)&&o.stage===stage);return `<div class="lane"><div class="item-head"><h3>${stage}</h3><span class="badge">${list.length}</span></div><div class="kanban">${list.map(o=>`<div class="opp-card"><div class="item-head"><div><b>${esc(o.title)}</b><div class="small">${esc(o.company||"")}</div></div><button class="icon" onclick="editOpportunity('${o.id}')">✎</button></div><div class="row" style="margin-top:7px"><span class="badge ${urgency(o).cls}">${urgency(o).label}</span><span class="badge">${fitScore(o)}/100</span></div>${o.deadline?`<div class="small" style="margin-top:5px">Deadline: ${esc(o.deadline)}</div>`:""}</div>`).join("")||'<div class="small muted">Empty</div>'}</div></div>`}).join("")}</div>`;
}
function addOpportunity(prefill={}){
 modal("Opportunity record",opportunityForm({...prefill,id:prefill.id||""}),`<button class="primary" onclick="saveOpportunityForm()">Save opportunity</button>`);
}
function opportunityForm(o){
 return `<input type="hidden" id="oid" value="${esc(o.id||"")}"><div class="form">
 <div class="full"><label>Title</label><input id="otitle" value="${esc(o.title||"")}"></div>
 <div><label>Type</label><select id="otype">${["Internship","Hackathon","Research","Competition","Fellowship","Event","Open Source","Scholarship","Other"].map(x=>`<option ${o.type===x?"selected":""}>${x}</option>`).join("")}</select></div>
 <div><label>Company / organization</label><input id="ocompany" value="${esc(o.company||"")}"></div>
 <div><label>Year relevant</label><select id="oyear">${[1,2,3,4].map(y=>`<option ${Number(o.year||1)===y?"selected":""}>${y}</option>`).join("")}</select></div>
 <div><label>Deadline</label><input id="odeadline" type="date" value="${esc(o.deadline||"")}"></div>
 <div><label>Follow-up date</label><input id="ofollow" type="date" value="${esc(o.followUpDate||"")}"></div>
 <div><label>Stage</label><select id="ostage">${STAGES.map(s=>`<option ${o.stage===s?"selected":""}>${s}</option>`).join("")}</select></div>
 <div><label>Status</label><select id="ostatus">${["open","done","closed"].map(s=>`<option ${o.status===s?"selected":""}>${s}</option>`).join("")}</select></div>
 <div><label>Fit (0–100)</label><input id="ofit" type="number" min="0" max="100" value="${Number(o.fit||0)}"></div>
 <div><label>Proof value (0–100)</label><input id="oproof" type="number" min="0" max="100" value="${Number(o.proofValue||0)}"></div>
 <div><label>Learning value (0–100)</label><input id="olearn" type="number" min="0" max="100" value="${Number(o.learningValue||0)}"></div>
 <div><label>Contact</label><input id="ocontact" value="${esc(o.contact||"")}"></div>
 <div class="full"><label>Application URL</label><input id="oapply" value="${esc(o.applyUrl||"")}"></div>
 <div class="full"><label>Source / discovery URL</label><input id="osource" value="${esc(o.sourceUrl||"")}"></div>
 <div class="full"><label>Notes / eligibility / requirements / next action</label><textarea id="onotes">${esc(o.notes||"")}</textarea></div>
 </div>`;
}
function saveOpportunityForm(){
 const o={id:document.getElementById("oid").value||uid("o"),title:document.getElementById("otitle").value.trim(),type:document.getElementById("otype").value,company:document.getElementById("ocompany").value.trim(),year:Number(document.getElementById("oyear").value),deadline:document.getElementById("odeadline").value,followUpDate:document.getElementById("ofollow").value,stage:document.getElementById("ostage").value,status:document.getElementById("ostatus").value,fit:Number(document.getElementById("ofit").value)||0,proofValue:Number(document.getElementById("oproof").value)||0,learningValue:Number(document.getElementById("olearn").value)||0,contact:document.getElementById("ocontact").value.trim(),applyUrl:document.getElementById("oapply").value.trim(),sourceUrl:document.getElementById("osource").value.trim(),notes:document.getElementById("onotes").value};
 if(!o.title)return alert("Title required");
 const idx=P.opportunities.findIndex(x=>x.id===o.id);if(idx>=0)P.opportunities[idx]=o;else P.opportunities.push(o);
 save();closeModal();render();toast("Opportunity saved privately");
}
function editOpportunity(id){const o=P.opportunities.find(x=>x.id===id);if(o)addOpportunity(o)}
function deadlines(){
 const a=P.opportunities.slice().filter(o=>o.status!=="closed").sort((x,y)=>{
   const dx=daysUntil(x.deadline);const dy=daysUntil(y.deadline);return (dx??99999)-(dy??99999)
 });
 const follow=a.filter(o=>o.followUpDate).sort((x,y)=>(x.followUpDate||"").localeCompare(y.followUpDate||""));
 return `<div class="grid two"><div class="card"><h2>Deadlines</h2>${a.map(o=>oppRow(o)).join("")||'<div class="empty">No active opportunities.</div>'}</div><div class="card"><h2>Follow-up queue</h2>${follow.map(o=>`<div class="item"><div class="item-head"><div><b>${esc(o.title)}</b><div class="small">${esc(o.contact||"No contact recorded")} · ${esc(o.followUpDate)}</div></div><button class="icon" onclick="editOpportunity('${o.id}')">✎</button></div><div class="row" style="margin-top:6px"><span class="badge ${urgency({deadline:o.followUpDate}).cls}">${urgency({deadline:o.followUpDate}).label}</span></div></div>`).join("")||'<div class="empty">No scheduled follow-ups.</div>'}</div></div>
 <div class="section card"><h2>Calendar export</h2><p class="small">Export active opportunity deadlines and follow-ups as an <code>.ics</code> calendar file. Your calendar receives only what you explicitly export.</p><div class="actions"><button class="primary" onclick="exportCalendar()">Export opportunity calendar</button><button class="ghost" onclick="requestNotifications()">Enable browser alerts</button></div></div>`;
}
function exportCalendar(){
 const evs=[];P.opportunities.filter(o=>o.status!=="closed").forEach(o=>{if(o.deadline)evs.push(icsEvent(o.title+" — deadline",o.deadline,`Opportunity: ${o.title}\nStage: ${o.stage||""}\nApplication: ${o.applyUrl||o.sourceUrl||""}`));if(o.followUpDate)evs.push(icsEvent(o.title+" — follow-up",o.followUpDate,`Follow-up for: ${o.title}\nContact: ${o.contact||""}`))});
 if(!evs.length)return toast("No dates to export");
 const ics=["BEGIN:VCALENDAR","VERSION:2.0","PRODID:-//ICT Career Dashboard//EN","CALSCALE:GREGORIAN",...evs,"END:VCALENDAR"].join("\r\n");download(ics,"ict-career-opportunities.ics","text/calendar");toast("Calendar exported");
}
function icsEvent(summary,date,desc){const day=date.replaceAll("-","");return ["BEGIN:VEVENT",`UID:${uid("ev")}`,`DTSTAMP:${new Date().toISOString().replace(/[-:]/g,"").replace(/\\.\\d{3}Z$/,"Z")}`,`DTSTART;VALUE=DATE:${day}`,`SUMMARY:${icsEsc(summary)}`,`DESCRIPTION:${icsEsc(desc)}`,"END:VEVENT"].join("\r\n")}
function icsEsc(s){return String(s).replace(/\\/g,"\\\\").replace(/;/g,"\\;").replace(/,/g,"\\,").replace(/\n/g,"\\n")}
function actions(){
 const ts=mergedTasks().filter(t=>t.status!=="done"&&Number(t.year||1)===Number(P.settings.focusYear||1));
 return `<div class="card"><div class="actions"><button class="primary" onclick="addPersonalTask()">+ Personal action</button><button class="ghost" onclick="setView('roadmap')">View roadmap</button></div><p class="small">Showing unfinished actions for Year ${Number(P.settings.focusYear||1)}. Template actions are public; your completion state is private.</p></div><div class="section list">${ts.map(taskRow).join("")||'<div class="empty">No unfinished actions for this year.</div>'}</div>`;
}
function taskRow(t){return `<div class="item"><div class="item-head"><div><div class="item-title">${esc(t.title)}</div><div class="small">${esc(t.category)} · Year ${t.year} · ${esc(t.priority||"")}</div></div><button class="icon" onclick="toggleTask('${t.id}')">✓</button></div>${t.link?`<a class="link small" target="_blank" rel="noreferrer" href="${esc(t.link)}">Open resource</a>`:""}</div>`}
function addPersonalTask(){const year=P.settings.focusYear||1;modal("Personal action",`<div class="form"><div class="full"><label>Title</label><input id="mt"></div><div><label>Category</label><input id="mc" value="Career"></div><div><label>Year</label><select id="my">${[1,2,3,4].map(y=>`<option ${y===year?"selected":""}>${y}</option>`).join("")}</select></div><div><label>Priority</label><select id="mp"><option>high</option><option selected>medium</option><option>low</option></select></div><div><label>Due</label><input id="md" type="date"></div><div class="full"><label>Link</label><input id="ml"></div></div>`,`<button class="primary" onclick="savePersonalTask()">Add</button>`)}
function savePersonalTask(){const t={id:uid("t"),title:document.getElementById("mt").value.trim(),category:document.getElementById("mc").value,year:Number(document.getElementById("my").value),priority:document.getElementById("mp").value,due:document.getElementById("md").value,status:"todo",link:document.getElementById("ml").value.trim()};if(!t.title)return alert("Title required");P.tasks.push(t);save();closeModal();render()}
function toggleTask(id){P.taskState[id]=P.taskState[id]||{};P.taskState[id].status=P.taskState[id].status==="done"?"todo":"done";save();render();toast("Progress saved privately")}
function projects(){return `<div class="card"><button class="primary" onclick="addProject()">+ Project</button><p class="small">Capture problem, stack, your contribution, results and evidence.</p></div><div class="section grid two">${P.projects.map(p=>`<div class="card"><div class="item-head"><div><h3>${esc(p.title)}</h3><span class="badge">Year ${p.year}</span></div><button class="icon" onclick="removePrivate('projects','${p.id}')">×</button></div><p>${esc(p.problem||"")}</p><div class="small"><b>Stack:</b> ${esc(p.stack||"-")}</div><div class="small"><b>Your role:</b> ${esc(p.role||"-")}</div><div class="small"><b>Result:</b> ${esc(p.result||"-")}</div>${p.link?`<a class="link small" target="_blank" rel="noreferrer" href="${esc(p.link)}">Proof</a>`:""}</div>`).join("")||'<div class="empty">No projects yet.</div>'}</div>`}
function addProject(){modal("New project",`<div class="form"><div class="full"><label>Title</label><input id="pt"></div><div class="full"><label>Problem</label><textarea id="pp"></textarea></div><div><label>Stack</label><input id="ps"></div><div><label>Year</label><select id="pyr">${[1,2,3,4].map(y=>`<option>${y}</option>`).join("")}</select></div><div class="full"><label>Your role</label><textarea id="prole"></textarea></div><div class="full"><label>Result / proof</label><textarea id="pres"></textarea></div><div class="full"><label>GitHub/demo</label><input id="plink"></div></div>`,`<button class="primary" onclick="saveProject()">Add</button>`)}
function saveProject(){const p={id:uid("p"),title:document.getElementById("pt").value.trim(),problem:document.getElementById("pp").value,stack:document.getElementById("ps").value,year:Number(document.getElementById("pyr").value),status:"active",role:document.getElementById("prole").value,result:document.getElementById("pres").value,link:document.getElementById("plink").value.trim()};if(!p.title)return alert("Title required");P.projects.push(p);save();closeModal();render()}
function network(){return `<div class="card"><button class="primary" onclick="addPerson()">+ Person</button><p class="small">Store only information you are comfortable keeping locally.</p></div><div class="section card"><table><tr><th>Name</th><th>Role</th><th>Met</th><th>Last</th><th>Next</th><th></th></tr>${P.people.map(p=>`<tr><td><b>${esc(p.name)}</b></td><td>${esc(p.role||"")}</td><td>${esc(p.met||"")}</td><td>${esc(p.last||"")}</td><td>${esc(p.next||"")}</td><td><button class="icon" onclick="removePrivate('people','${p.id}')">×</button></td></tr>`).join("")||'<tr><td colspan="6" class="small">No relationships recorded.</td></tr>'}</table></div>`}
function addPerson(){modal("Private relationship",`<div class="form"><div><label>Name</label><input id="nn"></div><div><label>Role / college / company</label><input id="nr"></div><div class="full"><label>How met</label><input id="nm"></div><div class="full"><label>Next useful step</label><textarea id="nx"></textarea></div><div class="full"><label>Private notes</label><textarea id="nnotes"></textarea></div></div>`,`<button class="primary" onclick="savePerson()">Add</button>`)}
function savePerson(){const p={id:uid("n"),name:document.getElementById("nn").value.trim(),role:document.getElementById("nr").value,met:document.getElementById("nm").value,last:new Date().toISOString().slice(0,10),next:document.getElementById("nx").value,notes:document.getElementById("nnotes").value};if(!p.name)return alert("Name required");P.people.push(p);save();closeModal();render()}
function proof(){return `<div class="card"><button class="primary" onclick="addProof()">+ Proof</button><p class="small">Evidence: project, internship, open source, competition, research, users, talk, award, recommendation.</p></div><div class="section grid two">${P.evidence.map(e=>`<div class="card"><div class="item-head"><div><h3>${esc(e.title)}</h3><span class="badge">${esc(e.type)}</span></div><button class="icon" onclick="removePrivate('evidence','${e.id}')">×</button></div><p>${esc(e.result||"")}</p>${e.link?`<a class="link small" target="_blank" rel="noreferrer" href="${esc(e.link)}">Evidence</a>`:""}</div>`).join("")||'<div class="empty">No proof items yet.</div>'}</div>`}
function addProof(){modal("Proof item",`<div class="form"><div class="full"><label>Title</label><input id="et"></div><div><label>Type</label><select id="ety"><option>project</option><option>internship</option><option>open source</option><option>competition</option><option>research</option><option>talk</option><option>award</option></select></div><div><label>Date</label><input id="ed" type="date"></div><div class="full"><label>Result</label><textarea id="er"></textarea></div><div class="full"><label>Evidence URL</label><input id="el"></div></div>`,`<button class="primary" onclick="saveProof()">Add</button>`)}
function saveProof(){const e={id:uid("e"),title:document.getElementById("et").value.trim(),type:document.getElementById("ety").value,result:document.getElementById("er").value,link:document.getElementById("el").value,date:document.getElementById("ed").value};if(!e.title)return alert("Title required");P.evidence.push(e);save();closeModal();render()}
function review(){return `<div class="card"><h2>Weekly review</h2><p>Last review: ${esc(P.settings.lastReview||"Never")}</p><div class="form"><div class="full"><label>What did I ship/finish?</label><textarea id="rq1"></textarea></div><div class="full"><label>What created capability?</label><textarea id="rq2"></textarea></div><div class="full"><label>What created proof, relationship or opportunity?</label><textarea id="rq3"></textarea></div><div class="full"><label>What was fake productivity?</label><textarea id="rq4"></textarea></div><div class="full"><label>What are next week's 3 highest-value actions?</label><textarea id="rq5"></textarea></div></div><button class="primary" onclick="saveReview()">Save review</button></div><div class="section list">${P.reviews.slice().reverse().map(r=>`<div class="item"><div class="item-head"><b>${esc(r.date)}</b><button class="icon" onclick="removePrivate('reviews','${r.id}')">×</button></div><p><b>Shipped:</b> ${esc(r.q1)}</p><p><b>Capability:</b> ${esc(r.q2)}</p><p><b>Proof/network:</b> ${esc(r.q3)}</p><p><b>Fake productivity:</b> ${esc(r.q4)}</p><p><b>Next:</b> ${esc(r.q5)}</p></div>`).join("")||'<div class="empty">No reviews yet.</div>'}</div>`}
function saveReview(){const q=[1,2,3,4,5].map(i=>document.getElementById("rq"+i).value.trim());if(!q.some(Boolean))return alert("Write at least one answer.");const d=new Date().toISOString().slice(0,10);P.reviews.push({id:uid("r"),date:d,q1:q[0],q2:q[1],q3:q[2],q4:q[3],q5:q[4]});P.settings.lastReview=d;save();render();toast("Review saved")}
function data(){return `<div class="grid two"><div class="card"><h2>Privacy model</h2><div class="privacy"><b>Public:</b> <code>data/public-template.json</code> — generic roadmap and discovery sources.</div><div class="privacy" style="margin-top:8px"><b>Private:</b> browser localStorage — applications, people, progress, reviews, projects and notes.</div><div class="dangerbox" style="margin-top:8px"><b>Never commit:</b> exported private backups, private contact data, credentials or API keys.</div></div><div class="card"><h2>Private profile</h2><div class="form"><div><label>Name</label><input id="dn" value="${esc(P.profile.name)}"></div><div><label>Degree</label><input id="dd" value="${esc(P.profile.degree)}"></div><div><label>Start year</label><input id="ds" type="number" value="${esc(P.profile.startYear)}"></div><div class="full"><label>Target</label><input id="dt" value="${esc(P.profile.target)}"></div></div><button class="primary" onclick="saveProfile()">Save profile</button></div></div><div class="section card"><h2>Backup / migration</h2><div class="actions"><button class="primary" onclick="exportPrivate()">Export private JSON</button><button class="ghost" onclick="document.getElementById('privateFile').click()">Import / merge private JSON</button><button class="ghost" onclick="openGpt()">GPT sync</button><button class="ghost" onclick="resetPrivate()">Reset private state</button></div><p class="small">Import is merge-based when IDs exist; it creates a safety backup before changing local data.</p></div>`}
function saveProfile(){P.profile.name=document.getElementById("dn").value.trim();P.profile.degree=document.getElementById("dd").value.trim();P.profile.startYear=Number(document.getElementById("ds").value)||new Date().getFullYear();P.profile.target=document.getElementById("dt").value.trim();save();render();toast("Profile saved locally")}
function removePrivate(c,id){if(!confirm("Delete this private item?"))return;P[c]=P[c].filter(x=>x.id!==id);save();render()}
function resetPrivate(){if(!confirm("Reset all private data? Export first if you need a backup."))return;localStorage.removeItem(PRIVATE_KEY);location.reload()}
function download(text,name,type){const b=new Blob([text],{type:type||"application/json"}),a=document.createElement("a");a.href=URL.createObjectURL(b);a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)}
function exportPrivate(){download(JSON.stringify(P,null,2),"ict-ai-career-private-backup-v4.json")}
function importPrivate(e){const f=e.target.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{try{const x=JSON.parse(r.result);if(x.schemaVersion!==1||x.type!=="private-backup")throw new Error("Expected schemaVersion 1 + type private-backup.");download(JSON.stringify(P,null,2),"ict-ai-career-pre-import-backup.json");P=mergePrivate(P,x);save();render();toast("Private data merged safely")}catch(err){alert("Import failed: "+err.message)}e.target.value=""};r.readAsText(f)}
function mergePrivate(a,b){
 const out={...a,...b,profile:{...a.profile,...(b.profile||{})},settings:{...a.settings,...(b.settings||{})}};
 for(const c of ["tasks","projects","people","opportunities","evidence","reviews","notes"]){
   const map=new Map((a[c]||[]).map(x=>[x.id,x]));for(const x of (b[c]||[]))map.set(x.id,{...(map.get(x.id)||{}),...x});out[c]=[...map.values()];
 }
 out.taskState={...(a.taskState||{}),...(b.taskState||{})};return out;
}
function openGpt(){
 const payload={schemaVersion:1,type:"private-backup",profile:P.profile,taskState:P.taskState,tasks:P.tasks,projects:P.projects,people:P.people,opportunities:P.opportunities,evidence:P.evidence,reviews:P.reviews,notes:P.notes,settings:P.settings};
 const prompt=`I use "ICT → AI Era Career Dashboard v4". Return ONLY valid JSON with schemaVersion:1 and type:"private-backup". Preserve existing IDs. Do not invent personal facts. Merge/update rather than deleting. Focus on highest-value career moves for a BE ICT student: CS fundamentals, building, hackathons, events, professors, alumni, internships, open source, research, competitions, communication, proof of work and opportunity cost. For opportunities use fields: {id,title,type,company,year,deadline,followUpDate,stage,status,fit,proofValue,learningValue,contact,applyUrl,sourceUrl,notes}. stage must be one of discovered, shortlisted, preparing, applied, assessment, interview, accepted, rejected, withdrawn. status must be open, done or closed. For current opportunities, verify official URLs and exact deadlines before including them. Do not expose secrets. Current private dashboard state follows:\n\n${JSON.stringify(payload,null,2)}`;
 modal("GPT sync",`<p>Copy this prompt into GPT. Ask GPT for an update or current opportunity shortlist. Save its JSON reply as a file, then choose <b>Import / merge private JSON</b>.</p><textarea style="min-height:350px" id="gptprompt">${esc(prompt)}</textarea><div class="notice" style="margin-top:10px">Anything you paste into GPT leaves this browser. Do not include passwords, API keys, sensitive credentials or unnecessary private contact details.</div>`,`<button class="primary" onclick="navigator.clipboard?.writeText(document.getElementById('gptprompt').value);toast('GPT prompt copied');closeModal()">Copy prompt</button>`);
}
async function requestNotifications(){if(!("Notification" in window))return toast("Notifications are not supported.");const p=await Notification.requestPermission();P.settings.notifications=p==="granted";save();if(p==="granted"){notifyUrgent();toast("Browser alerts enabled")}else toast("Permission not granted")}
function notifyUrgent(){if(!P.settings.notifications||!("Notification" in window)||Notification.permission!=="granted")return;const urgent=P.opportunities.filter(o=>o.status!=="closed"&&daysUntil(o.deadline)!==null&&daysUntil(o.deadline)<=3);if(urgent.length)new Notification("ICT Career Dashboard", {body:`${urgent.length} opportunity deadline(s) are due within 3 days.`})}
function deadlinePulse(){if(P.opportunities.length){const overdue=P.opportunities.filter(o=>o.status!=="closed"&&daysUntil(o.deadline)<0).length;if(overdue)toast(`${overdue} opportunity deadline(s) overdue`);notifyUrgent()}}
boot();
</script>
</body>
</html>
