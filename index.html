<script>
/* PWA install flow: Android/Chrome gets the native prompt; iPhone gets clear Safari instructions. */
let deferredInstallPrompt = null;
const isAppleMobile = /iPhone|iPad|iPod/i.test(navigator.userAgent);
const isStandaloneApp = window.matchMedia("(display-mode: standalone)").matches || navigator.standalone === true;

function syncInstallButton(){
  const button = document.getElementById("installApp");
  if (!button) return;
  button.hidden = isStandaloneApp || (!deferredInstallPrompt && !isAppleMobile);
}

window.addEventListener("beforeinstallprompt", event => {
  event.preventDefault();
  deferredInstallPrompt = event;
  syncInstallButton();
});

window.addEventListener("appinstalled", () => {
  deferredInstallPrompt = null;
  const button = document.getElementById("installApp");
  if (button) button.hidden = true;
});

window.installCareerApp = async function(){
  if (deferredInstallPrompt) {
    deferredInstallPrompt.prompt();
    await deferredInstallPrompt.userChoice;
    deferredInstallPrompt = null;
    syncInstallButton();
    return;
  }
  if (isAppleMobile) {
    modal("Install Career OS", "<p>In Safari, tap the <b>Share</b> button, then choose <b>Add to Home Screen</b>. Confirm <b>Add</b> to install this dashboard as an app.</p><p class='small'>Open the site in Safari rather than an in-app browser if you do not see the Share button.</p>", "<button class='primary' onclick='closeModal()'>Got it</button>");
    return;
  }
  modal("Install Career OS", "<p>To install this dashboard, open your browser menu and choose <b>Install app</b> or <b>Add to Home screen</b>.</p>", "<button class='primary' onclick='closeModal()'>Got it</button>");
};
</script>

<script>
const PRIVATE_KEY="ictAiCareerDashboard.private.v4";
const DEFAULT_PRIVATE={schemaVersion:1,type:"private-backup",profile:{name:"",degree:"BE ICT",startYear:new Date().getFullYear(),target:"AI Systems / AI Engineering + Systems"},taskState:{},tasks:[],projects:[],people:[],opportunities:[],evidence:[],reviews:[],notes:[],settings:{focusYear:1,lastReview:"",notifications:false}};
let P=loadPrivate(), T={schemaVersion:1,type:"public-template",goals:[],tasks:[],checklist:{},links:[],sources:[]}, view="dashboard", search="";
function loadPrivate(){
  try {
    const x = JSON.parse(
      localStorage.getItem(PRIVATE_KEY)
    );

    return {
      ...DEFAULT_PRIVATE,
      ...x,

      profile: {
        ...DEFAULT_PRIVATE.profile,
        ...(x?.profile || {})
      },

      settings: {
        ...DEFAULT_PRIVATE.settings,
        ...(x?.settings || {})
      }
    };

  } catch {
    return structuredClone(DEFAULT_PRIVATE);
  }
}
const STAGES=["discovered","shortlisted","preparing","applied","assessment","interview","accepted","rejected","withdrawn"];
const TASK_STATUS=["todo","done"];

function esc(v=""){return String(v).replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m]))}
function uid(p){return p+Math.random().toString(36).slice(2,9)}
function save(){
  localStorage.setItem(
    PRIVATE_KEY,
    JSON.stringify(P)
  );

  window.__scheduleCloudSync?.(
    structuredClone(P)
  );
}
function mergeItems(localItems = [], cloudItems = []) {
  const map = new Map(
    localItems
      .filter(x => x && x.id)
      .map(x => [String(x.id), x])
  );

  for (const item of cloudItems || []) {
    if (!item || !item.id) continue;

    const id = String(item.id);

    map.set(
      id,
      {
        ...(map.get(id) || {}),
        ...item
      }
    );
  }

  return [...map.values()];
}


window.__applyCloudState = function(cloud) {

  if (!cloud) return;


  P = {
    ...P,

    profile: cloud.profile
      ? {
          ...P.profile,
          ...cloud.profile
        }
      : P.profile,

    taskState: {
      ...(P.taskState || {}),
      ...(cloud.taskState || {})
    },

    tasks: mergeItems(
      P.tasks,
      cloud.tasks
    ),

    projects: mergeItems(
      P.projects,
      cloud.projects
    ),

    people: mergeItems(
      P.people,
      cloud.people
    ),

    opportunities: mergeItems(
      P.opportunities,
      cloud.opportunities
    ),

    evidence: mergeItems(
      P.evidence,
      cloud.evidence
    ),

    reviews: mergeItems(
      P.reviews,
      cloud.reviews
    ),

    notes: mergeItems(
      P.notes,
      cloud.notes
    ),

    settings: {
      ...(P.settings || {}),
      ...(cloud.settings || {})
    }
  };


  /*
    Keep the local copy as a backup/cache.
  */

  localStorage.setItem(
    PRIVATE_KEY,
    JSON.stringify(P)
  );


  /*
    If local v4 contained records that were not
    in Supabase, the scheduled sync will upload them.
  */

  window.__scheduleCloudSync?.(
    structuredClone(P)
  );
};
async function boot(){
 try{const r=await fetch("./data/public-template.json",{cache:"no-store"});if(r.ok)T=await r.json()}catch(e){console.warn("Public template unavailable",e)}
 if (

 renderNav();render();deadlinePulse();

function render(){document.getElementById("today").textContent=new Date().toLocaleDateString(undefined,{weekday:"long",year:"numeric",month:"long",day:"numeric"});const meta={dashboard:["Dashboard","Turn opportunities into actions and outcomes."],discover:["Discover","Public sources for internships, hackathons, research, competitions and events."],opportunities:["Opportunity Pipeline","Track every serious opportunity from discovery to outcome."],deadlines:["Deadlines","Prevent missed applications and forgotten follow-ups."],actions:["My Actions","Execution tasks across the four-year roadmap."],projects:["Projects","Proof-producing work, not tutorial collections."],network:["Network","Real relationships and follow-ups."],proof:["Proof","External evidence of your ability."],review:["Review","Weekly reflection and opportunity-cost control."],data:["Private Data","Your personal data stays in this browser unless you explicitly export it."]}[view];document.getElementById("title").textContent=meta[0];document.getElementById("subtitle").textContent=meta[1];({dashboard,discover,opportunities,deadlines,actions,projects,network,proof,review,data})[view] && (document.getElementById("view").innerHTML=({dashboard,discover,opportunities,deadlines,actions,projects,network,proof,review,data})[view]())}

function fitScore(o){let s=0;s+=Number(o.fit||0);s+=Number(o.proofValue||0);s+=Number(o.learningValue||0);if(o.deadline){const d=daysUntil(o.deadline);if(d!==null&&d>=0&&d<=14)s+=5}return Math.min(100,Math.round(s/3))}
function dashboard(){
 const open=P.opportunities.filter(o=>o.status!=="closed"), overdue=open.filter(o=>daysUntil(o.deadline)<0), due=open.filter(o=>daysUntil(o.deadline)!==null&&daysUntil(o.deadline)>=0&&daysUntil(o.deadline)<=14), follow=open.filter(o=>o.followUpDate&&daysUntil(o.followUpDate)<=3&&daysUntil(o.followUpDate)>=0);
 const ts=mergedTasks(),done=ts.filter(t=>t.status==="done").length,pct=Math.round(done/(ts.length||1)*100);

 return `<div class="privacy"><b>Opportunity engine model:</b> Discover → Shortlist → Prepare → Apply → Interview → Outcome. This static version uses public sources and private tracking; it does not pretend to continuously scrape third-party sites.</div>

 const evs=[];P.opportunities.filter(o=>o.status!=="closed").forEach(o=>{if(o.deadline)evs.push(icsEvent(o.title+" — deadline",o.deadline,`Opportunity: ${o.title}\nStage: ${o.stage||""}\nApplication: ${o.applyUrl||o.sourceUrl||""}`));if(o.followUpDate)evs.push(icsEvent(o.title+" — follow-up",o.followUpDate,`Follow-up for: ${o.title}\nContact: ${o.contact||""}`))});

async function resetPrivate(){

  if (
    !confirm(
      "Reset ALL private Career OS data?\n\n" +
      "This removes your cloud data and local copy. " +
      "Your Supabase login account will remain."
    )
  ) {
    return;
  }


  /*
    Create a backup BEFORE destructive operation.
  */

  download(
    JSON.stringify(P, null, 2),
    "ict-ai-career-before-reset.json"
  );


  try {

    await window.__resetCloudState?.();

    localStorage.removeItem(PRIVATE_KEY);

    location.reload();

  } catch (error) {

    console.error(error);

    alert(
      "Reset failed. Your local data was kept.\n\n" +
      error.message
    );
  }
}
function download(text,name,type){const b=new Blob([text],{type:type||"application/json"}),a=document.createElement("a");a.href=URL.createObjectURL(b);a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)}
function exportPrivate(){download(JSON.stringify(P,null,2),"ict-ai-career-private-backup-v4.json")}
function importPrivate(e){const f=e.target.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{try{const x=JSON.parse(r.result);if(x.schemaVersion!==1||x.type!=="private-backup")throw new Error("Expected schemaVersion 1 + type private-backup.");download(JSON.stringify(P,null,2),"ict-ai-career-pre-import-backup.json");P=mergePrivate(P,x);save();render();toast("Private data merged safely")}catch(err){alert("Import failed: "+err.message)}e.target.value=""};r.readAsText(f)}
function mergePrivate(a,b){
 const out={...a,...b,profile:{...a.profile,...(b.profile||{})},settings:{...a.settings,...(b.settings||{})}};
 for(const c of ["tasks","projects","people","opportunities","evidence","reviews","notes"]){
   const map=new Map((a[c]||[]).map(x=>[x.id,x]));for(const x of (b[c]||[]))map.set(x.id,{...(map.get(x.id)||{}),...x});out[c]=[...map.values()];
 }
 out.taskState={...(a.taskState||{}),...(b.taskState||{})};return out;
}
function openGpt(){
 const payload={schemaVersion:1,type:"private-backup",profile:P.profile,taskState:P.taskState,tasks:P.tasks,projects:P.projects,people:P.people,opportunities:P.opportunities,evidence:P.evidence,reviews:P.reviews,notes:P.notes,settings:P.settings};
 const prompt=`I use "ICT → AI Era Career Dashboard v4". Return ONLY valid JSON with schemaVersion:1 and type:"private-backup". Preserve existing IDs. Do not invent personal facts. Merge/update rather than deleting. Focus on highest-value career moves for a BE ICT student: CS fundamentals, building, hackathons, events, professors, alumni, internships, open source, research, competitions, communication, proof of work and opportunity cost. For opportunities use fields: {id,title,type,company,year,deadline,followUpDate,stage,status,fit,proofValue,learningValue,contact,applyUrl,sourceUrl,notes}. stage must be one of discovered, shortlisted, preparing, applied, assessment, interview, accepted, rejected, withdrawn. status must be open, done or closed. For current opportunities, verify official URLs and exact deadlines before including them. Do not expose secrets. Current private dashboard state follows:\n\n${JSON.stringify(payload,null,2)}`;
 modal("GPT sync",`<p>Copy this prompt into GPT. Ask GPT for an update or current opportunity shortlist. Save its JSON reply as a file, then choose <b>Import / merge private JSON</b>.</p><textarea style="min-height:350px" id="gptprompt">${esc(prompt)}</textarea><div class="notice" style="margin-top:10px">Anything you paste into GPT leaves this browser. Do not include passwords, API keys, sensitive credentials or unnecessary private contact details.</div>`,`<button class="primary" onclick="navigator.clipboard?.writeText(document.getElementById('gptprompt').value);toast('GPT prompt copied');closeModal()">Copy prompt</button>`);
}
async function requestNotifications(){if(!("Notification" in window))return toast("Notifications are not supported.");const p=await Notification.requestPermission();P.settings.notifications=p==="granted";save();if(p==="granted"){notifyUrgent();toast("Browser alerts enabled")}else toast("Permission not granted")}
function notifyUrgent(){if(!P.settings.notifications||!("Notification" in window)||Notification.permission!=="granted")return;const urgent=P.opportunities.filter(o=>o.status!=="closed"&&daysUntil(o.deadline)!==null&&daysUntil(o.deadline)<=3);if(urgent.length)new Notification("ICT Career Dashboard", {body:`${urgent.length} opportunity deadline(s) are due within 3 days.`})}
function deadlinePulse(){if(P.opportunities.length){const overdue=P.opportunities.filter(o=>o.status!=="closed"&&daysUntil(o.deadline)<0).length;if(overdue)toast(`${overdue} opportunity deadline(s) overdue`);notifyUrgent()}}
window.__bootDashboard = boot;
</script>

<script>
// Manga animation helpers + UI toggle with persistence
function setMangaMode(on){
  if(on) document.body.classList.add('manga-mode'); else document.body.classList.remove('manga-mode');
  localStorage.setItem('mangaMode', on ? '1' : '0');
  const btn = document.getElementById('mangaToggle');
  if(btn){ btn.classList.toggle('active', on); btn.textContent = on ? 'Manga: On' : 'Manga: Off'; btn.setAttribute('aria-pressed', on); }
  return on;
}

window.toggleManga = function(on){
  if(typeof on === 'undefined') return setMangaMode(!document.body.classList.contains('manga-mode'));
  return setMangaMode(Boolean(on));
}

window.mangaPageTurn = function(){
  const el = document.querySelector('.app'); if(!el) return; el.classList.add('page-turn'); setTimeout(()=>el.classList.remove('page-turn'),600);
}

window.mangaToast = function(msg){
  const t = document.getElementById('toast'); if(!t) return; t.textContent = msg; t.classList.add('show','manga-shake','ink-splash');
  setTimeout(()=>t.classList.remove('show','manga-shake'),2400);
  setTimeout(()=>t.classList.remove('ink-splash'),420);
}

document.addEventListener('DOMContentLoaded', ()=>{
  const pref = localStorage.getItem('mangaMode');
  const initOn = pref === '1' ? true : (pref === '0' ? false : document.body.classList.contains('manga-mode'));
  setMangaMode(initOn);
  const btn = document.getElementById('mangaToggle');
  if(btn) btn.addEventListener('click', ()=> setMangaMode(!document.body.classList.contains('manga-mode')));
});
</script>
