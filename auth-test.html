<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Career OS Login</title>

  <style>
    body {
      font-family: system-ui, sans-serif;
      max-width: 420px;
      margin: 60px auto;
      padding: 20px;
    }

    form {
      display: grid;
      gap: 12px;
    }

    input, button {
      padding: 10px;
      font: inherit;
    }

    button {
      cursor: pointer;
    }

    #output {
      margin-top: 20px;
      white-space: pre-wrap;
    }
  </style>
</head>

<body>
  <h1>Career OS</h1>

  <form id="login-form">
    <input
      id="email"
      type="email"
      placeholder="Email"
      required
    >

    <input
      id="password"
      type="password"
      placeholder="Password"
      required
    >

    <button type="submit">
      Sign in
    </button>
  </form>

  <p id="output">Checking session...</p>

  <script type="module">
    import {
      getCurrentUser,
      signIn
    } from "./src/auth.js";

    const form = document.getElementById("login-form");
    const output = document.getElementById("output");

    const user = await getCurrentUser();

    if (user) {
      output.textContent =
        `Already signed in as ${user.email}`;
    } else {
      output.textContent = "Not signed in.";
    }

    form.addEventListener("submit", async (event) => {
      event.preventDefault();

      const email =
        document.getElementById("email").value.trim();

      const password =
        document.getElementById("password").value;

      output.textContent = "Signing in...";

      try {
        const data = await signIn(email, password);

        output.textContent =
          `Login successful.\nUser ID: ${data.user.id}`;
      } catch (error) {
        output.textContent =
          `Login failed: ${error.message}`;
      }
    });
  </script>
</body>
</html>
